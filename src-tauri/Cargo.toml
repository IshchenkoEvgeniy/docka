[package]
name = "doska"
version = "0.1.0"
description = "Доска — визуальные доски для проектирования игр и программ"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Имя отличается от бинарника, иначе на Windows конфликтуют файлы сборки.
name = "doska_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dunce = "1.0.5"
percent-encoding = "2.3.2"
tauri-plugin-dialog = "2"
base64 = "0.23"
# Превью ссылок (ADR 0005): тот же HTTP-клиент, что уже есть в Tauri, TLS — rustls с ring.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# Тестовая среда Tauri: вызов команд через настоящий IPC без окна.
tauri = { version = "2", features = ["test"] }
